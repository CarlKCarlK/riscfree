[package]
name = "riscfree"
version = "0.3.0"
edition = "2024"
publish = false
description = "RISC-V assembly demonstrations for the LuatOS ESP32-C3 Core Board"
license = "MIT OR Apache-2.0"

[features]
default = ["esp32c3"]
esp32c3 = [
    "esp-hal/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-println/esp32c3",
]

[target.'cfg(target_os = "none")'.dependencies]
esp-hal = { version = "1.1.0", default-features = false, features = ["rt"] }
esp-bootloader-esp-idf = { version = "0.5.0", default-features = false }
esp-println = { version = "0.17.0", default-features = false, features = ["uart"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
