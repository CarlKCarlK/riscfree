name = "riscfree"
moreLeanArgs = ["--tstack=400000"]
defaultTargets = ["Riscfree"]

[leanOptions]
warningAsError = true

[[require]]
name = "pico-fv"
git = "https://github.com/NethermindEth/pico-fv"
rev = "a7f9a0976e245aeef89c3f02c51ae85023207b53"

# The RangeSetBlaze mathematical proofs, required after pico-fv so that
# pico-fv's Mathlib and Sail versions are the ones resolved.
[[require]]
name = "range-set-blaze-vibe-validation"
git = "https://github.com/CarlKCarlK/range-set-blaze-vibe-validation"
rev = "d7837025ca5ed1ec74f35768ea12d97014dad249"

[[lean_lib]]
name = "Riscfree"
srcDir = "proof"
roots = ["Popcount", "PopcountSpec", "PopcountSwar", "RawVec", "RawVec.Nonvacuity", "RawVec.Shim",
  "RawVec.Compatibility", "RawVec.PairInsert", "RawVec.PairInsert.Nonvacuity", "RawVec.U32Remove",
  "RawVec.U32Remove.Nonvacuity", "RawVec.PairRemove", "RawVec.PairRemove.Nonvacuity", "Riscfree.Elf", "Riscfree.NormalForm",
  "Riscfree.RV32", "Riscfree.StateRun"]
globs = ["Popcount", "PopcountSpec", "PopcountSwar", "RawVec", "RawVec.+", "SortedMap.+", "RangeInsert.+", "Riscfree.Elf", "Riscfree.NormalForm",
  "Riscfree.RV32.+", "Riscfree.StateRun"]
