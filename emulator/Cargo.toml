[package]
name = "riscfree-emulator"
version = "0.1.0"
edition = "2024"
publish = false
description = "Run the riscfree routines' linked machine code under QEMU, without hardware"
license = "MIT OR Apache-2.0"

[features]
# Call the SWAR popcount instead of the bit loop.
swar = []
range-map-full = []
range-scratch-full = []

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
